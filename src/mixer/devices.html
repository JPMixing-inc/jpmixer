<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Devices — JPMixer</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <link rel="stylesheet" href="devices.css" />
</head>
<body class="disconnected">

  <header class="mon-header">
    <img src="logo.png" class="brand-logo" alt="JPMixer" />
    <span class="mon-title">Devices</span>
    <span class="mon-snapshot" id="devDeviceCount">0 devices connected</span>
    <span class="conn-dot" id="connDot"></span>
  </header>

  <div class="dev-grid" id="devGrid">
    <div class="dev-empty" id="devEmpty">No musician devices connected yet.</div>
  </div>

  <div class="overlay" id="overlay">
    <div class="overlay-content">
      <div class="spinner"></div>
      <p id="overlayMsg">Connecting to console…</p>
    </div>
  </div>

  <script src="devices.js"></script>
</body>
</html>
